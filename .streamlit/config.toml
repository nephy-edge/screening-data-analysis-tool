[theme]
base = "light"
primaryColor = "#2f9e6e"
backgroundColor = "#f2f6f3"
secondaryBackgroundColor = "#ffffff"
textColor = "#1c2a31"

[server]
headless = true
# MB; default is 200. Streamlit Community Cloud's own reverse proxy may still
# cap real-world uploads below this even though the app itself accepts it.
maxUploadSize = 1024
