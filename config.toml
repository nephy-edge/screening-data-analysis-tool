# Externalized settings for the SC Analysis - LTV & Unit Economics tool.
#
# Edit this file to change AI/API endpoints, request limits, general-inputs
# defaults, or credit/FX stress assumptions WITHOUT touching application
# code. Every value here has a matching hardcoded fallback in config.py, so
# a missing file, a typo, or a stale key from an older template version
# degrades to that fallback instead of breaking the app.
#
# API keys are NOT stored here - they stay in Streamlit secrets or the
# DEEPINFRA_API_KEY environment variable (see .env / .streamlit/secrets.toml).

[ai]
model = "deepseek-ai/DeepSeek-V4-Flash-0731"
chat_url = "https://api.deepinfra.com/v1/openai/chat/completions"
request_timeout_seconds = 30
mapping_suggestion_max_tokens = 768
escalation_writeup_max_tokens = 700
chat_assistant_max_tokens = 800

[ai.prompts]

mapping_suggestion = '''
You are a data-mapping assistant for a lending/leasing portfolio screening tool. Users upload a raw loan-tape file (Excel or CSV) whose column headers vary by lender - inconsistent naming, abbreviations, different languages, or extra columns not relevant to this analysis. Your job is to map that file's raw column names onto a FIXED set of template fields this tool needs in order to run its calculations.

For each template field listed below, choose the single raw column whose MEANING best matches that field - not just similar spelling. Use the short description given for each field to judge intent (e.g. a field described as "principal amount lent" should map to a column like "loan_amount" or "disbursed_principal", not merely to some other column that happens to contain numbers).

Available raw columns (use these exact names, verbatim, or null if none fit): %%COLUMNS%%

Template fields to fill (name, whether required, and what each one means):
%%FIELDS%%

Rules:
- Each raw column may be used for AT MOST ONE template field - never map two different template fields to the same raw column, even if both seem plausible; pick whichever field it fits best and leave the other null.
- Prefer an exact or near-exact name match (ignoring case, spacing, and punctuation) over a purely semantic guess when one exists.
- If a required field has no plausible match at all, still respond with null for it rather than guessing at a loosely related column - a human will map it manually afterward.
- Do not invent a raw column name that isn't in the list above.

Separately, decide whether the file needs a ROW EXCLUSION rule: some raw tapes include rows that must never count toward the analysis at all - e.g. unbooked/draft applications, cancelled or test records, or anything the documentation explicitly says to exclude. If you find a single column and one or more specific values that mark such rows - from the documentation provided, or from an unambiguous flag column (e.g. values literally "EXCLUDE" or "test") - include it as "_exclude_rows": {"column": "<exact raw column name>", "values": ["<value1>", ...]}. Only include this when you have concrete evidence naming the column and value(s); if there's none, set "_exclude_rows" to null. Never guess at this without a real signal - wrongly excluding real loans would silently corrupt every downstream figure.

Separately again, if you mapped a source column to "Loan Status", decide whether you actually know that column's value vocabulary well enough (from the documentation provided - raw column names alone never tell you cell values) to say which specific values mean the loan is still ACTIVE/OUTSTANDING (not yet paid off, closed, settled, written off, or cancelled). If so, include "_active_status_values": ["<value1>", ...] - the exact raw values (case-sensitive) that mean active. If you weren't given the column's actual values anywhere, do not guess - omit this key or set it to null.

Respond with ONLY a JSON object, no markdown fences, no commentary - just the mapping of each template field to a raw column name (exact string, case-sensitive) or null when no column plausibly matches, plus the optional "_exclude_rows" and "_active_status_values" fields described above. Example:
{"Loan ID": "account_id", "Disbursement Date": "funded_at", "Loan Status": "status", "Total Due": null, "_exclude_rows": {"column": "GhostFlag", "values": ["EXCLUDE - unbooked application"]}, "_active_status_values": ["OPEN", "IN ARREARS"]}
'''

mapping_suggestion_context_suffix = '''


The user has also provided additional documentation about this specific dataset below (e.g. a data dictionary, a description of the loan product, or notes on quirks in the file). Treat it as authoritative: when it conflicts with a guess you'd otherwise make from column names alone, defer to what the documentation says - it may also clarify a column that would otherwise look ambiguous or irrelevant.
'''

escalation_writeup = '''
You help draft a Slack message escalating a data-quality anomaly from a %%MODEL_NAME%% portfolio screening tool to the analytics team. The recipient is a credit analyst who has NOT seen the underlying data - they only have what you write, so be self-contained and precise.

Uploaded file name: %%FILENAME%%

Flagged cohort facts (already-aggregated, cohort-level statistics - you have no access to individual loan rows):
%%FACTS%%

Do the following:
1. Guess the borrower/company name from the file name (strip file extensions, dates, and generic words like 'template' or 'loan tape'). If you can't tell, use "Unknown Borrower".
2. Rewrite the flagged cohort facts into a clear, well organized Slack message (Slack mrkdwn: *bold* for emphasis, bullet points with '-') summarizing what's flagged and the likely causes. Open with one sentence stating what portfolio/borrower this is and how many issues were flagged, then list each flagged fact as its own bullet with its likely cause. Use ONLY the numbers and facts given above - never invent, round unusually, or estimate a figure that isn't present.
3. For any fact whose likely cause is "No obvious data-driven cause", add a short *Possible lines of inquiry (hypotheses to verify with the Borrower - not conclusions)* section with 2-3 plausible external explanations common to a %%MODEL_NAME%% business (e.g. underwriting/recovery policy changes, a servicing or system migration, a regulatory change, a one-off portfolio sale or write-off). Make clear these are hypotheses to ask about, not established facts - never state them as the actual cause. Omit this section entirely if every fact already has a data-driven cause.
4. Keep the tone professional and the message scannable - short sentences, no filler, no restating the same fact twice.

Respond with ONLY a JSON object, no markdown fences, no commentary:
{"borrower_name": "<name>", "message": "<Slack mrkdwn write-up>"}
'''

chat_assistant = '''
You are a data analyst assistant embedded in a lending/leasing portfolio screening tool, talking to a credit risk analyst who is reviewing a specific uploaded portfolio. Answer questions about that portfolio using ONLY the summary statistics and methodology notes below - you do not have access to individual loan rows, only these already-computed aggregates.

Guidelines:
- If a question needs a number that isn't in the summary (e.g. a specific loan ID, or a breakdown not listed), say so plainly rather than guessing or inventing a figure.
- If asked "why" or "how" a metric is calculated, explain it using the exact formula/methodology notes given below, not a generic or simplified description of how such a metric is usually calculated elsewhere.
- You may perform simple arithmetic that directly combines numbers already given below (e.g. a difference, a ratio, a sum) - but never estimate or extrapolate a new metric that isn't derivable from the numbers provided.
- When a figure has a caveat attached below (e.g. "n/a because Total Due isn't mapped", or "matured loans only"), always carry that caveat into your answer rather than stating the number in isolation.
- Be concise and precise; use the exact terminology given below (e.g. "Estimated APR", "Loss Rate Proxy") rather than paraphrasing it into different words.

Stay strictly within this data's domain: only answer questions about this portfolio, this analysis, or this conversation's own history - never general knowledge, current events, today's date, or anything unrelated to the uploaded file, even if you believe you know the answer. If asked something outside that scope, reply with only a brief, polite refusal (e.g. 'I can only help with questions about this portfolio's data and analysis.') - do not attempt to answer it or speculate.
'''

[fx]
api_url = "https://open.er-api.com/v6/latest/USD"
cache_ttl_seconds = 3600
request_timeout_seconds = 15

[general_inputs_defaults]
days_after_term = 90
min_loans_per_cohort = 10

# UE Model tab "Manual inputs" - defaults for the % number-input widgets
# (entered/shown as whole percent, e.g. 1.0 = 1%).
[ue_model_cost_defaults]
upfront_cost_pct = 1.0
ongoing_cost_pct = 2.0
financing_cost_pct = 13.0
facility_fee_pct = 2.0
hedge_cost_pct = 3.0

[credit_stress]
fx_stress_factor = 1.2
credit_stress_factor = 1.7

# Revolving Lending (RCL) model - General Inputs defaults, from
# rcl_rollrate_ecl_3.xlsx ('Roll Rate ECL' B5:B8, 'Loss Rate LTV' B9:B12) and
# the Revolving Lending template's Outputs tab (2-month ratio window).
[revolving_defaults]
lgd = 1.0
roll_rate_window = "T12"          # T3 / T6 / T12 / ALL
ratio_window_months = 2           # months (ending at the as-of month) the Outputs averages use
min_outstanding_in_sample = 1000000000.0
stress_percentile = 0.95
denominator_lag_months = 5
lagged_blend_weight = 0.5
loss_rate_basis = "Blended"       # Naive / Blended / Lagged - feeds Outputs Loss Rate / 95th %ile
balance_tolerance = 1.0           # buckets must sum to PRINCIPAL_OUTSTANDING within this
unexplained_warning_pct = 0.05    # warn when UNEXPLAINED / outstanding exceeds this

# Raw-header spellings that should auto-map to each template field, keyed by
# model ("lending" / "rental") so an alias never leaks across models (e.g.
# Lending's "start date" -> "Disbursement Date" must not also claim a Rental
# file's own start_date field). Matching ignores case/spacing/punctuation.
[field_aliases.lending]
"Loan ID" = ["loan id", "loan_id", "account id", "account_id", "id", "loan no", "loan number", "contract no", "contract number"]
"Disbursement Date" = ["disbursement date", "disbursal date", "disbursed date", "funded date", "funding date", "start date", "origination date", "loan date", "issue date"]
"Expected Completion Date" = ["expected completion date", "maturity date", "expected end date", "end date", "expected maturity", "due date"]
"Principal Value" = ["principal value", "principal", "loan amount", "disbursement amount", "principal amount"]
"Expected Interest" = ["expected interest", "interest", "interest amount", "expected interest amount"]
"Gross Loan Value" = ["gross loan value", "total loan value", "gross value"]
"Expected Fee" = ["expected fee", "fee", "fee amount", "upfront fee", "expected fees"]
"Total Paid" = ["total paid", "amount paid", "total repayments", "payments", "total amount paid"]
"Total Due" = ["total due", "total dues calculated", "total due calculated", "pos", "outstanding", "balance", "amount due"]
"Loan Status" = ["loan status", "status", "loan status label", "account status"]
"Days Late" = ["days late", "days past due", "dpd", "days overdue", "days in arrears"]
"Term (days)" = ["term (days)", "term", "tenor", "tenor (days)", "loan term", "term in days", "loan tenor"]
"Payment per Period" = ["payment per period", "payment", "installment", "instalment", "monthly payment", "periodic payment"]
"Payment Frequency" = ["payment frequency", "frequency", "payment terms", "repayment frequency"]

[field_aliases.rental]
# No aliases defined yet for the Rental & Subscription model - add entries
# here (e.g. "contract_id" = ["contract id", "contract no"]) as needed.
